{% extends "base.html" %}
{% block title %}Owner login{% endblock %}
{% block content %}
<h1>Owner login</h1>
<p>Enter the shared passcode to view and manage upcoming bookings.</p>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="/owner">
    <label>
        Passcode
        <input type="password" name="passcode" required autofocus>
    </label>
    <button type="submit">View bookings</button>
</form>
{% endblock %}
